# Phase 1 check: the copied engine renders its own sample clip on a GitHub runner.
# Started by hand only (Actions tab, or `gh workflow run engine-sample --ref <branch>`), so it never spends minutes on its own.
name: engine-sample

on:
  workflow_dispatch:

concurrency:
  group: engine-sample-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-render
      - name: Tests
        run: npm test
      - name: Render the engine's sample clip
        run: node factory/render-sample.js | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-sample
          path: out/engine-sample.mp4
          retention-days: 3
