<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#1d1b26">
<meta name="mobile-web-app-capable" content="yes">
<title>Smart Feed</title>
<!-- use-credentials: behind the password lock the manifest is only served with the sign-in cookie -->
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="feed.css">
</head>
<body>
<main id="feed" aria-label="Clips"></main>

<div id="top">
  <span id="count"></span>
</div>
<button id="sound" hidden>Tap for sound</button>
<div id="message" hidden></div>

<script src="feed.js" defer></script>
</body>
</html>
